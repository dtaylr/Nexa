services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me}
      DB_PATH: /data/1platform.sqlite
      CORS_ORIGIN: http://localhost:6173
    volumes:
      - db_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Passed to Vite at build time — URL the browser will use to reach the API
        VITE_API_URL: http://localhost:3001/api
    ports:
      - "6173:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Seeds the database via the admin reset endpoint.
  # Run once after first bring-up:   docker compose run --rm seed
  # Or any time fresh demo data is needed. 
  seed:
    image: alpine/curl
    command: >
      sh -c "
        echo 'Waiting for API...' &&
        until curl -sf http://api:3001/health; do sleep 2; done &&
        echo 'Seeding...' &&
        curl -sf -X POST http://api:3001/api/admin/reset &&
        echo 'Seed complete.'
      "
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - seed

volumes:
  db_data:
