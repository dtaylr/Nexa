# Default values — override per environment with -f values.<env>.yaml

global:
  imageRegistry: ghcr.io/1platform
  imagePullPolicy: Always

api:
  replicaCount: 2
  image:
    repository: 1platform-api
    tag: latest
  service:
    port: 3001
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    minAvailable: 1
  env:
    NODE_ENV: production
    LOG_LEVEL: info
  probes:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 20
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 3
    startup:
      failureThreshold: 6
      periodSeconds: 5

web:
  replicaCount: 2
  image:
    repository: 1platform-web
    tag: latest
  service:
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

ingress:
  enabled: true
  className: nginx
  host: app.1platform.internal
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "20"

secrets:
  # Set via --set secrets.jwtSecret=<value> or a sealed-secret
  jwtSecret: ""

networkPolicy:
  enabled: true
