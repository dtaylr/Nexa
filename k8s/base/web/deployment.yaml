apiVersion: apps/v1
kind: Deployment
metadata:
  name: 1platform-web
  namespace: 1platform
  labels:
    app.kubernetes.io/name: 1platform-web
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: 1platform
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: 1platform-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app.kubernetes.io/name: 1platform-web
        app.kubernetes.io/component: frontend

    spec:
      serviceAccountName: 1platform-web
      automountServiceAccountToken: false

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: 1platform-web

      securityContext:
        runAsNonRoot: true
        runAsUser: 101      # nginx default non-root user
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: web
          image: ghcr.io/1platform/1platform-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: VITE_API_URL
              valueFrom:
                configMapKeyRef:
                  name: 1platform-config
                  key: API_URL

          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run

      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}

      terminationGracePeriodSeconds: 15
