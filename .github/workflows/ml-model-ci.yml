name: ML Model CI

# Triggered when ML model code or training data changes.
# Trains on seeded data, evaluates metrics, fails if quality regresses.
# Uploads a model card as a build artifact.

on:
  push:
    paths:
      - 'ai/ml/**'
      - 'db/seed.ts'
  pull_request:
    paths:
      - 'ai/ml/**'
  schedule:
    # Weekly drift check — model may degrade as seed data evolves
    - cron: '0 3 * * 1'
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:

  ml-unit-tests:
    name: ML Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx vitest run ai/ml/__tests__/ --reporter=verbose --coverage
        env:
          DB_PATH: ':memory:'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-unit-coverage
          path: coverage/

  # seed data + evaluate
  anomaly-model-eval:
    name: Anomaly Detector — Train & Evaluate
    runs-on: ubuntu-latest
    needs: ml-unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Seed database
        run: npm run seed
        env:
          DB_PATH: data/1platform.db

      - name: Train and evaluate anomaly detector
        id: evaluate
        run: |
          npx tsx ai/ml/training/train-anomaly.ts \
            --output artifacts/anomaly-model-eval.json \
            --threshold-precision 0.80 \
            --threshold-recall 0.75
        env:
          DB_PATH: data/1platform.db

      - name: Parse evaluation results
        run: |
          PRECISION=$(jq '.precision' artifacts/anomaly-model-eval.json)
          RECALL=$(jq '.recall' artifacts/anomaly-model-eval.json)
          F1=$(jq '.f1' artifacts/anomaly-model-eval.json)
          echo "### Anomaly Detector Metrics" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value | Threshold |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Precision | ${PRECISION} | ≥ 0.80 |" >> $GITHUB_STEP_SUMMARY
          echo "| Recall    | ${RECALL}    | ≥ 0.75 |" >> $GITHUB_STEP_SUMMARY
          echo "| F1        | ${F1}        | —       |" >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: anomaly-model-eval
          path: artifacts/anomaly-model-eval.json

  #  Flakiness predictor evaluation
  flakiness-model-eval:
    name: Flakiness Predictor — Evaluate
    runs-on: ubuntu-latest
    needs: ml-unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Download recent test results
        uses: actions/download-artifact@v4
        with:
          pattern: api-results-*
          path: results/api/
        continue-on-error: true   # OK if no prior results exist yet

      - name: Run flakiness analysis
        run: |
          npx tsx ai/ml/training/evaluate-flakiness.ts \
            --results-dir results/ \
            --output artifacts/flakiness-report.json
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flakiness-report
          path: artifacts/flakiness-report.json

  model-card:
    name: Generate Model Card
    needs: [anomaly-model-eval, flakiness-model-eval]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: anomaly-model-eval
          path: artifacts/
        continue-on-error: true

      - name: Write model card
        run: |
          cat > artifacts/model-card.md <<EOF
          # 1Platform ML Model Card

          **Generated:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}

          ## Anomaly Detector (Isolation Forest)

          - Algorithm: Isolation Forest (Liu et al. 2008)
          - Features: amount (log-scaled), hour-of-day (cyclic), day-of-week (cyclic),
            account velocity (24h), amount z-score, is-weekend
          - Training data: 1Platform seed transactions (~500 records)
          - Contamination rate: 5%
          - Trees: 100, max samples: 256

          ## Flakiness Predictor (Beta Distribution)

          - Algorithm: Beta(α, β) recency-weighted pass rate model
          - Recommendation thresholds: quarantine >0.6, investigate >0.35, monitor >0.15
          - Decay half-life: 7 days

          ## Usage

          \`\`\`typescript
          import { AnomalyDetector } from 'ai/ml/anomaly-detection/detector';
          const detector = new AnomalyDetector().fit(trainingData);
          const result = detector.predict(transaction);
          \`\`\`
          EOF
          cat artifacts/model-card.md

      - uses: actions/upload-artifact@v4
        with:
          name: model-card
          path: artifacts/model-card.md
