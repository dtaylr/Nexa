name: CD — Staging Deployment

# Triggered on every merge to main.
# Builds images, deploys to staging K8s, runs smoke tests.
# Automatic rollback if smoke tests fail.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy (defaults to commit SHA)'
        required: false
        type: string

env:
  NODE_VERSION: '24'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  K8S_NAMESPACE: 1platform-staging
  K8S_API_DEPLOYMENT: staging-1platform-api
  K8S_WEB_DEPLOYMENT: staging-1platform-web

jobs:
  # Build & push Docker images
  build:
    name: Build Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Determine image tag
        id: meta
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          echo "version=${TAG:0:12}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/1platform-api:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/1platform-api:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=staging

      - name: Build & push Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/1platform-web:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/1platform-web:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=https://staging.1platform.internal/api

  # Deploy to staging K8s (kustomize overlay)
  deploy-staging:
    name: Deploy → Staging
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.1platform.internal
    outputs:
      previous_revision: ${{ steps.record-revision.outputs.revision }}
    steps:
      - uses: actions/checkout@v7

      - name: Install kubectl and kustomize
        shell: bash
        run: |
          KUBECTL_VERSION="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          rm kubectl

          KUSTOMIZE_TAG="$(curl -fsSL https://api.github.com/repos/kubernetes-sigs/kustomize/releases/latest | sed -n 's/.*"tag_name": "\(kustomize\/[^"]*\)".*/\1/p')"
          KUSTOMIZE_VERSION="${KUSTOMIZE_TAG#kustomize/}"

          curl -fsSLo kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/${KUSTOMIZE_TAG}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz
          sudo install -o root -g root -m 0755 kustomize /usr/local/bin/kustomize
          rm kustomize kustomize.tar.gz

      - name: Configure kubectl
        shell: bash
        env:
          STAGING_KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG }}
        run: |
          set -euo pipefail

          if [[ -z "${STAGING_KUBECONFIG_B64}" ]]; then
            echo "::error::STAGING_KUBECONFIG secret is empty or unavailable."
            exit 1
          fi

          printf '%s' "${STAGING_KUBECONFIG_B64}" | base64 -d > /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          echo "KUBECONFIG=${KUBECONFIG}" >> "$GITHUB_ENV"

          kubectl config current-context
          kubectl cluster-info

      - name: Record current deployment revision (for rollback)
        id: record-revision
        run: |
          set -euo pipefail

          REV=""
          if GET_OUTPUT=$(kubectl get deployment/${{ env.K8S_API_DEPLOYMENT }} -n ${{ env.K8S_NAMESPACE }} 2>&1); then
            REV=$(kubectl rollout history deployment/${{ env.K8S_API_DEPLOYMENT }} -n ${{ env.K8S_NAMESPACE }} \
              --no-headers | awk 'NF { revision=$1 } END { print revision }')
          elif grep -qi 'not found' <<< "${GET_OUTPUT}"; then
            echo "::warning::No existing ${{ env.K8S_API_DEPLOYMENT }} deployment found; rollback revision will be empty."
          else
            echo "${GET_OUTPUT}"
            exit 1
          fi

          echo "revision=${REV}" >> $GITHUB_OUTPUT

      - name: Update image tags in overlay
        run: |
          cd k8s/overlays/staging
          kustomize edit set image \
            ghcr.io/1platform/1platform-api=${{ env.IMAGE_PREFIX }}/1platform-api:${{ needs.build.outputs.image_tag }} \
            ghcr.io/1platform/1platform-web=${{ env.IMAGE_PREFIX }}/1platform-web:${{ needs.build.outputs.image_tag }}

      - name: Apply manifests
        run: |
          set -euo pipefail
          kustomize build k8s/overlays/staging | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ env.K8S_API_DEPLOYMENT }} -n ${{ env.K8S_NAMESPACE }} --timeout=120s
          kubectl rollout status deployment/${{ env.K8S_WEB_DEPLOYMENT }} -n ${{ env.K8S_NAMESPACE }} --timeout=120s

  # Smoke tests against staging
  smoke-tests:
    name: Smoke Tests
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run smoke suite
        run: npx playwright test tests/smoke/ --reporter=junit,list
        env:
          BASE_URL: https://staging.1platform.internal
          API_URL: https://staging.1platform.internal/api
        timeout-minutes: 5

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-results
          path: test-results/

  # 4. Lighthouse audit against staging
  # Runs after smoke passes. Warns on score regressions but does
  # not block the deployment — use results to track trends.
  lighthouse:
    name: Lighthouse Audit
    needs: smoke-tests
    if: needs.smoke-tests.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run Lighthouse against staging
        run: |
          npx lhci autorun \
            --collect.url=https://staging.1platform.internal/ \
            --collect.url=https://staging.1platform.internal/finance \
            --collect.url=https://staging.1platform.internal/health \
            --collect.url=https://staging.1platform.internal/commerce \
            --collect.numberOfRuns=2 \
            --collect.settings.preset=desktop \
            --upload.target=filesystem \
            --upload.outputDir=results/lighthouse
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-staging
          path: results/lighthouse/

  # Auto-rollback if smoke tests failed
  rollback:
    name: Rollback (on smoke failure)
    needs: [deploy-staging, smoke-tests]
    if: failure() && needs.smoke-tests.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Configure kubectl
        shell: bash
        env:
          STAGING_KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG }}
        run: |
          set -euo pipefail

          if [[ -z "${STAGING_KUBECONFIG_B64}" ]]; then
            echo "::error::STAGING_KUBECONFIG secret is empty or unavailable."
            exit 1
          fi

          printf '%s' "${STAGING_KUBECONFIG_B64}" | base64 -d > /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          echo "KUBECONFIG=${KUBECONFIG}" >> "$GITHUB_ENV"

          kubectl config current-context
          kubectl cluster-info

      - name: Rollback API deployment
        run: |
          PREVIOUS_REVISION="${{ needs.deploy-staging.outputs.previous_revision }}"

          if [[ -n "${PREVIOUS_REVISION}" ]]; then
            kubectl rollout undo deployment/${{ env.K8S_API_DEPLOYMENT }} -n ${{ env.K8S_NAMESPACE }} \
              --to-revision="${PREVIOUS_REVISION}"
          else
            echo "::warning::No previous API revision was recorded; rolling back to the prior revision if Kubernetes has one."
            kubectl rollout undo deployment/${{ env.K8S_API_DEPLOYMENT }} -n ${{ env.K8S_NAMESPACE }}
          fi

          kubectl rollout status deployment/${{ env.K8S_API_DEPLOYMENT }} -n ${{ env.K8S_NAMESPACE }} --timeout=60s

      - name: Rollback Web deployment
        run: |
          kubectl rollout undo deployment/${{ env.K8S_WEB_DEPLOYMENT }} -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/${{ env.K8S_WEB_DEPLOYMENT }} -n ${{ env.K8S_NAMESPACE }} --timeout=60s

      - name: Notify on rollback
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue?.number ?? 0,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Staging Rollback Triggered\n\nSmoke tests failed for commit \`${{ github.sha }}\`.\nStaging has been rolled back to revision \`${{ needs.deploy-staging.outputs.previous_revision }}\`.\n\nInvestigate before re-deploying.`,
            }).catch(() => {}); // ignore if no PR context

  deployment-summary:
    name: Deployment Summary
    needs: [build, deploy-staging, smoke-tests, lighthouse]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          STATUS="${{ needs.smoke-tests.result }}"
          ICON=$([[ "$STATUS" == "success" ]] && echo "✅" || echo "❌")
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## ${ICON} Staging Deployment — ${{ github.sha }}

          | Step | Result |
          |------|--------|
          | Build | ${{ needs.build.result }} |
          | Deploy | ${{ needs.deploy-staging.result }} |
          | Smoke Tests | ${{ needs.smoke-tests.result }} |
          | Lighthouse | ${{ needs.lighthouse.result }} |

          **Image tag:** \`${{ needs.build.outputs.image_tag }}\`
          **Environment:** [staging.1platform.internal](https://staging.1platform.internal)
          EOF
