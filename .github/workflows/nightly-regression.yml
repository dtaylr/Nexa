name: Nightly Regression — All Domains

on:
  schedule:
    - cron: '0 2 * * 1-5'
  workflow_dispatch:
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  JWT_SECRET: ci-test-secret

jobs:
  # fastest — no server needed
  contract-tests:
    name: Contracts — ${{ matrix.domain }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        domain: [finance, health, commerce]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:contracts:${{ matrix.domain }} -- --reporter=verbose
        env:
          DB_PATH: ':memory:'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pact-files-${{ matrix.domain }}
          path: pacts/

  # parallel by domain
  api-tests:
    name: API — ${{ matrix.domain }}
    needs: contract-tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        domain: [finance, health, commerce]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Smoke — ${{ matrix.domain }}
        run: npm run test:smoke:${{ matrix.domain }}
        env:
          DB_PATH: ':memory:'
      - name: Regression — ${{ matrix.domain }}
        run: npm run test:regression:${{ matrix.domain }}
        env:
          DB_PATH: ':memory:'
      - name: Negative — ${{ matrix.domain }}
        run: npm run test:negative:${{ matrix.domain }}
        env:
          DB_PATH: ':memory:'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-results-${{ matrix.domain }}
          path: |
            results/vitest/smoke-${{ matrix.domain }}.junit.xml
            results/vitest/regression-${{ matrix.domain }}.junit.xml
            results/vitest/negative-${{ matrix.domain }}.junit.xml

  security-tests:
    name: Security (OWASP API Top 10)
    needs: contract-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:security
        env:
          DB_PATH: ':memory:'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-results
          path: results/vitest/security.junit.xml

  #  BDD Tests - requires running API server
  bdd-tests:
    name: BDD — ${{ matrix.domain }}
    needs: [api-tests, security-tests]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        domain: [finance, health, commerce]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Seed and start API
        run: |
          npm run seed
          npm run dev:api &
          npx wait-on http://localhost:3001/health --timeout 20000
      - name: Run BDD scenarios — ${{ matrix.domain }}
        run: |
          npx cucumber-js features/${{ matrix.domain }}/**/*.feature \
            --require features/step-definitions/**/*.ts \
            --require-module tsx/cjs \
            --tags "not @known-bug" \
            --format json:artifacts/cucumber-${{ matrix.domain }}.json \
            --format html:artifacts/cucumber-${{ matrix.domain }}.html
        env:
          API_URL: http://localhost:3001
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bdd-results-${{ matrix.domain }}
          path: |
            artifacts/cucumber-${{ matrix.domain }}.json
            artifacts/cucumber-${{ matrix.domain }}.html

  # E2E Desktop — sharded 2x per domain
  # Chromium + Firefox + WebKit + Edge run in parallel with mobile
  e2e-desktop:
    name: E2E Desktop — ${{ matrix.domain }} (shard ${{ matrix.shard }}/2)
    needs: [api-tests, security-tests]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        domain: [finance, health, commerce]
        shard: [1, 2]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install desktop browsers
        run: npx playwright install --with-deps chromium firefox webkit msedge
      - name: Seed and start servers
        run: |
          npm run seed
          npm run dev:api &
          npm run dev:web &
          npx wait-on http://localhost:3001/health http://localhost:6173 --timeout 30000
      - name: Run E2E desktop (shard ${{ matrix.shard }}/2)
        run: npx playwright test tests/${{ matrix.domain }}/ui --project=chromium --project=firefox --project=webkit --shard=${{ matrix.shard }}/2 --reporter=junit,html
        env:
          BASE_URL: http://localhost:6173
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-desktop-${{ matrix.domain }}-${{ matrix.shard }}
          path: |
            results/playwright/
            test-results/

  # E2E Mobile — sharded 2x per domain
  # Runs in parallel with desktop, covering mobile-chrome,
  # mobile-safari, mobile-small (iPhone SE), tablet (iPad Pro)
  e2e-mobile:
    name: E2E Mobile — ${{ matrix.domain }} (shard ${{ matrix.shard }}/2)
    needs: [api-tests, security-tests]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        domain: [finance, health, commerce]
        shard: [1, 2]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install mobile browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Seed and start servers
        run: |
          npm run seed
          npm run dev:api &
          npm run dev:web &
          npx wait-on http://localhost:3001/health http://localhost:6173 --timeout 30000
      - name: Run E2E mobile (shard ${{ matrix.shard }}/2)
        run: npx playwright test tests/${{ matrix.domain }}/ui --project=mobile-chrome --project=mobile-safari --project=mobile-small --project=tablet --shard=${{ matrix.shard }}/2 --reporter=junit,html
        env:
          BASE_URL: http://localhost:6173
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-mobile-${{ matrix.domain }}-${{ matrix.shard }}
          path: |
            results/playwright/
            test-results/

  accessibility-tests:
    name: Accessibility (WCAG 2.1 AA)
    needs: [api-tests, security-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Seed and start servers
        run: |
          npm run seed
          npm run dev:api &
          npm run dev:web &
          npx wait-on http://localhost:3001/health http://localhost:6173 --timeout 30000
      - run: npm run test:a11y
        env:
          BASE_URL: http://localhost:6173
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: a11y-report
          path: artifacts/a11y-report.json

  visual-regression:
    name: Visual Regression
    needs: [api-tests, security-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Seed and start servers
        run: |
          npm run seed
          npm run dev:api &
          npm run dev:web &
          npx wait-on http://localhost:3001/health http://localhost:6173 --timeout 30000
      - run: npm run test:visual:update
        env:
          BASE_URL: http://localhost:6173
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-snapshots
          path: |
            test-results/
            tests/visual/__snapshots__/

  # Lighthouse Performance Audit
  # Runs against the live dev server, 3 runs per URL, averages scores.
  # Fails CI if LCP > 3.5s or accessibility score < 0.9.
  lighthouse:
    name: Lighthouse Performance
    needs: [api-tests, security-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Lighthouse audits a production build via staticDistDir — no dev server needed.
      - run: npx playwright install --with-deps chromium
      - name: Run Lighthouse CI
        run: npm run test:lighthouse
        env:
          # Lighthouse scores as PR status checks. Wont post if omitted.
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: results/lighthouse/

  # Load Tests — k6 (nightly + manual only, not on PRs)
  load-tests:
    name: Load — ${{ matrix.domain }}
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        domain: [finance, commerce]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install k6
        run: |
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq
          sudo apt-get install -y k6
      - name: Prepare and start API
        run: |
          mkdir -p artifacts
          npm run seed
          npm run dev:api &
          npx wait-on http://localhost:3001/health --timeout 30000
        continue-on-error: true
      - run: npm run test:load:${{ matrix.domain }}
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-results-${{ matrix.domain }}
          path: artifacts/k6-${{ matrix.domain }}-summary.json
          if-no-files-found: warn

  # AI Triage + PR Comment (always runs)
  post-run-analysis:
    name: AI Triage + Test Report
    needs: [e2e-desktop, e2e-mobile, bdd-tests, accessibility-tests, visual-regression, security-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: api-results-*
          merge-multiple: true
          path: results/api/
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-desktop-*
          merge-multiple: true
          path: results/playwright/
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-mobile-*
          merge-multiple: true
          path: results/playwright/
      - uses: actions/download-artifact@v4
        with:
          pattern: bdd-results-*
          merge-multiple: true
          path: artifacts/

      - name: Build test matrix
        run: npm run matrix:build -- --results-dir results/
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        continue-on-error: true

      - name: Generate stakeholder report
        run: npm run matrix:report
        continue-on-error: true

      - run: npm run triage:analyze
        continue-on-error: true
      - run: npm run cost:report
        continue-on-error: true
      - name: ML flakiness analysis
        run: npm run ml:flakiness -- --results-dir results/ --output artifacts/flakiness-report.json
        continue-on-error: true

      - name: Generate test report
        run: npm run report
        continue-on-error: true

      - name: Write GitHub Step Summary
        if: always()
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const reportPath = 'results/report.json';
          if (!fs.existsSync(reportPath)) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Test Report\n\nNo results found.\n');
            process.exit(0);
          }
          const r = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const s = r.summary;
          const statusIcon = s.failed === 0 ? '✅' : s.failed <= 3 ? '⚠️' : '❌';
          const lines = [
            `## ${statusIcon} 1Platform Test Report`,
            '',
            `| Metric | Value |`,
            `|--------|-------|`,
            `| Total tests | **${s.total}** |`,
            `| ✅ Passed | **${s.passed}** |`,
            `| ❌ Failed | **${s.failed}** |`,
            `| ⏭ Skipped | **${s.skipped}** |`,
            `| Pass rate | **${s.passRate}%** |`,
            `| Bugs caught | **${r.intentionalBugsCaught.length}** |`,
            `| Duration | ${(s.duration / 1000).toFixed(1)}s |`,
            '',
            '### Domain Breakdown',
            '',
            '| Domain | Total | Passed | Failed | Pass Rate |',
            '|--------|-------|--------|--------|-----------|',
            ...r.domains.map(d => {
              const rate = d.total > 0 ? Math.round(d.passed / d.total * 100) : 0;
              const icon = { finance: '💰', health: '🏥', commerce: '🛒', auth: '🔐', security: '🛡️', other: '🔧' }[d.domain] || '🔧';
              return `| ${icon} ${d.domain} | ${d.total} | ${d.passed} | ${d.failed} | ${rate}% |`;
            }),
          ];
          const unexpected = r.failedTests.filter(t => !t.isExpectedFailure);
          if (unexpected.length > 0) {
            lines.push('', '### ❌ Unexpected Failures', '');
            for (const t of unexpected.slice(0, 10)) {
              lines.push(`- **${t.domain}** \`${t.fullName}\``);
            }
            if (unexpected.length > 10) lines.push(`- _…and ${unexpected.length - 10} more_`);
          }
          if (r.intentionalBugsCaught.length > 0) {
            lines.push('', '### 🐛 Intentional Bugs Caught by Tests', '');
            for (const t of r.intentionalBugsCaught.slice(0, 5)) {
              lines.push(`- ${t.fullName}`);
            }
          }
          lines.push('', `> Full HTML report available in the **test-report** artifact below.`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          EOF

      # Upload full HTML report as a downloadable artifact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: |
            results/report.html
            results/report.json
            results/test-matrix.json
            results/stakeholder-report.html
          retention-days: 30

      # Upload triage + cost artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triage-and-cost-reports
          path: artifacts/
          retention-days: 30

      # Post triage summary as PR comment
      - name: Post triage summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'artifacts/triage-report.json';
            if (!fs.existsSync(reportPath)) return;
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            if (!report.length) return;
            const lines = ['## AI Triage Report', ''];
            for (const item of report) {
              const icon = { CRITICAL: '🔴', HIGH: '🟠', MEDIUM: '🟡', LOW: '🟢' }[item.severity];
              lines.push(`${icon} **[${item.severity}]** \`${item.testName}\``);
              lines.push(`> ${item.action}`);
              if (item.escalate) lines.push('> ⚠️ **Block release — escalate to engineering lead**');
              lines.push('');
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: lines.join('\n'),
            });
