name: Nightly Regression — All Domains

on:
  schedule:
    - cron: '0 2 * * 1-5'
  workflow_dispatch:
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  JWT_SECRET: ci-test-secret

jobs:
  # ─────────────────────────────────────────────────────────
  # Layer 1: Contract Tests (fastest — no server needed)
  # ─────────────────────────────────────────────────────────
  contract-tests:
    name: Contracts — ${{ matrix.domain }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        domain: [finance, health, commerce]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:contracts:${{ matrix.domain }} -- --reporter=verbose
        env:
          DB_PATH: ':memory:'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pact-files-${{ matrix.domain }}
          path: pacts/

  # ─────────────────────────────────────────────────────────
  # Layer 2: API + Security Tests (parallel by domain)
  # ─────────────────────────────────────────────────────────
  api-tests:
    name: API — ${{ matrix.domain }}
    needs: contract-tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        domain: [finance, health, commerce]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:api:${{ matrix.domain }} -- --reporter=junit --outputFile=results/api/${{ matrix.domain }}/junit.xml
        env:
          DB_PATH: ':memory:'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-results-${{ matrix.domain }}
          path: results/api/${{ matrix.domain }}/junit.xml

  security-tests:
    name: Security (OWASP API Top 10)
    needs: contract-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:security -- --reporter=verbose --reporter=junit --outputFile=results/security/junit.xml
        env:
          DB_PATH: ':memory:'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-results
          path: results/security/junit.xml

  # ─────────────────────────────────────────────────────────
  # Layer 3a: BDD Tests (requires running API server)
  # ─────────────────────────────────────────────────────────
  bdd-tests:
    name: BDD — ${{ matrix.domain }}
    needs: [api-tests, security-tests]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        domain: [finance, health, commerce]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Seed and start API
        run: |
          npm run seed
          npm run dev:api &
          npx wait-on http://localhost:3001/health --timeout 20000
      - name: Run BDD scenarios — ${{ matrix.domain }}
        run: |
          npx cucumber-js features/${{ matrix.domain }}/**/*.feature \
            --require features/step-definitions/**/*.ts \
            --require-module tsx/cjs \
            --format json:artifacts/cucumber-${{ matrix.domain }}.json \
            --format html:artifacts/cucumber-${{ matrix.domain }}.html
        env:
          API_URL: http://localhost:3001
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bdd-results-${{ matrix.domain }}
          path: |
            artifacts/cucumber-${{ matrix.domain }}.json
            artifacts/cucumber-${{ matrix.domain }}.html

  # ─────────────────────────────────────────────────────────
  # Layer 3b: E2E Tests — sharded 2x per domain
  # ─────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E — ${{ matrix.domain }} (shard ${{ matrix.shard }}/2)
    needs: [api-tests, security-tests]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        domain: [finance, health, commerce]
        shard: [1, 2]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Seed and start servers
        run: |
          npm run seed
          npm run dev:api &
          npm run dev:web &
          npx wait-on http://localhost:3001/health http://localhost:3000 --timeout 30000
      - name: Run E2E (shard ${{ matrix.shard }}/2)
        run: npx playwright test tests/${{ matrix.domain }}/ui --shard=${{ matrix.shard }}/2 --reporter=junit,html
        env:
          BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts-${{ matrix.domain }}-${{ matrix.shard }}
          path: |
            test-results/
            artifacts/

  # ─────────────────────────────────────────────────────────
  # Layer 3c: Accessibility (WCAG 2.1 AA)
  # ─────────────────────────────────────────────────────────
  accessibility-tests:
    name: Accessibility (WCAG 2.1 AA)
    needs: [api-tests, security-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Seed and start servers
        run: |
          npm run seed
          npm run dev:api &
          npm run dev:web &
          npx wait-on http://localhost:3001/health http://localhost:3000 --timeout 30000
      - run: npm run test:a11y
        env:
          BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: a11y-report
          path: artifacts/a11y-report.json

  # ─────────────────────────────────────────────────────────
  # Layer 3d: Visual Regression
  # ─────────────────────────────────────────────────────────
  visual-regression:
    name: Visual Regression
    needs: [api-tests, security-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Seed and start servers
        run: |
          npm run seed
          npm run dev:api &
          npm run dev:web &
          npx wait-on http://localhost:3001/health http://localhost:3000 --timeout 30000
      - run: npm run test:visual
        env:
          BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: test-results/

  # ─────────────────────────────────────────────────────────
  # Layer 4: Load Tests — k6 (nightly + manual only, not on PRs)
  # ─────────────────────────────────────────────────────────
  load-tests:
    name: Load — ${{ matrix.domain }}
    needs: [e2e-tests, bdd-tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        domain: [finance, commerce]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install k6
        run: |
          curl -L https://github.com/grafana/k6/releases/download/v0.49.0/k6-v0.49.0-linux-amd64.tar.gz | tar xvz --strip-components 1
          sudo mv k6 /usr/local/bin/
      - run: npm ci
      - name: Seed and start API
        run: |
          npm run seed
          npm run dev:api &
          npx wait-on http://localhost:3001/health --timeout 20000
      - run: npm run test:load:${{ matrix.domain }}
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ matrix.domain }}
          path: artifacts/k6-${{ matrix.domain }}-summary.json

  # ─────────────────────────────────────────────────────────
  # Layer 5: AI Triage + PR Comment (always runs)
  # ─────────────────────────────────────────────────────────
  post-run-analysis:
    name: AI Triage + Cost Report
    needs: [e2e-tests, bdd-tests, accessibility-tests, visual-regression, security-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: api-results-*
          merge-multiple: true
          path: results/api/
      - uses: actions/download-artifact@v4
        with:
          pattern: bdd-results-*
          merge-multiple: true
          path: artifacts/
      - run: npm run triage:analyze
        continue-on-error: true
      - run: npm run cost:report
      - name: Post triage summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'artifacts/triage-report.json';
            if (!fs.existsSync(reportPath)) return;
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            if (!report.length) return;
            const lines = ['## AI Triage Report', ''];
            for (const item of report) {
              const icon = { CRITICAL: '🔴', HIGH: '🟠', MEDIUM: '🟡', LOW: '🟢' }[item.severity];
              lines.push(`${icon} **[${item.severity}]** \`${item.testName}\``);
              lines.push(`> ${item.action}`);
              if (item.escalate) lines.push('> ⚠️ **Block release — escalate to engineering lead**');
              lines.push('');
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: lines.join('\n'),
            });
      - uses: actions/upload-artifact@v4
        with:
          name: triage-and-cost-reports
          path: artifacts/
